[package]
name = "kami-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kami-identity = { path = "../kami-identity" }
kami-protocol = { path = "../kami-protocol" }
libp2p = { version = "=0.57.1", default-features = false, features = ["tokio", "quic", "tcp", "noise", "yamux", "request-response"] }
tokio = { version = "=1.54.1", features = ["sync", "time", "macros"] }

[dev-dependencies]
kami-key-provider = { path = "../kami-key-provider" }
tempfile = "3"

[lints]
workspace = true
