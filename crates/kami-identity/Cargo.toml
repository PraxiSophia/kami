[package]
name = "kami-identity"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
kami-key-provider = { path = "../kami-key-provider" }
zeroize = "=1.9.1"
getrandom = "=0.4.3"
ed25519-dalek = "=3.0.0"
sha2 = "=0.11.1"
libp2p-identity = { version = "=0.3.0", features = ["ed25519", "peerid"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.2.0", features = ["rt-async-io-crypto-rust"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring-core = "=1.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
security-framework = "=3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "deny"
