[package]
name = "kami-e2ee"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kami-core = { path = "../kami-core" }
kami-identity = { path = "../kami-identity" }
kami-protocol = { path = "../kami-protocol" }
libp2p-identity = { version = "0.3", features = ["peerid", "ed25519"] }
sha2 = "0.11"
zeroize = "1"
vodozemac = "=0.11.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
