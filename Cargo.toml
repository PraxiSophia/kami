[workspace]
resolver = "2"
members = [
    "crates/kami-core",
    "crates/kami-protocol",
    "crates/kami-cli",
    "crates/kami-key-provider",
    "crates/kami-identity",
    "crates/kami-storage",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
